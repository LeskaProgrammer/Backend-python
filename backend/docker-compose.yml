version: '3.8'

services:
  backend:
    build: .
    container_name: notes-api-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONUNBUFFERED=1
    command: /app/entrypoint.sh
    restart: unless-stopped

volumes:
  sqlite_data:
